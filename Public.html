<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 8 IPP Teacher Dashboard</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-xs">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2 rounded-xl font-bold text-lg">💡</div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
                Grade 8 IPP Dashboard
            </h1>
        </div>
        <div id="user-display" class="text-sm font-medium text-slate-600">
            <!-- Dynamic login state goes here -->
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Left Column: Auth / Quick Controls -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between space-y-6">
            <div>
                <h2 class="text-lg font-semibold text-slate-800 mb-4">Teacher Portal</h2>
                
                <!-- Login/Register Form -->
                <div id="auth-section" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Username</label>
                        <input type="text" id="username" placeholder="Enter username" 
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Password</label>
                        <input type="password" id="password" placeholder="Enter password" 
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition">
                    </div>
                    <div class="flex space-x-3 pt-2">
                        <button onclick="handleLogin()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-sm active:scale-95">
                            Login
                        </button>
                        <button onclick="handleRegister()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl text-sm transition active:scale-95">
                            Register
                        </button>
                    </div>
                </div>
            </div>

            <div class="border-t border-slate-100 pt-4 text-xs text-slate-400 text-center">
                Powered by Groq & Node.js
            </div>
        </div>

        <!-- Right Column: Gemini-Style AI Assistant Workspace -->
        <div class="md:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-semibold text-slate-800 mb-2">AI IPP Assistant</h2>
                <p class="text-sm text-slate-500 mb-4">Ask the AI to help draft student goals, accommodations, or teacher remarks.</p>
                
                <!-- Chat Output Box -->
                <div id="ai-response-box" class="bg-slate-50 border border-slate-200 rounded-xl p-4 h-64 overflow-y-auto text-sm text-slate-700 mb-4 whitespace-pre-wrap">
                    <span class="text-slate-400 italic">AI responses will appear here...</span>
                </div>
            </div>

            <!-- Prompt Input Area -->
            <div class="flex space-x-2">
                <input type="text" id="ai-prompt" placeholder="e.g., Write a reading goal for an 8th grader..." 
                    class="flex-1 px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition"
                    onkeypress="if(event.key === 'Enter') askAI()">
                <button onclick="askAI()" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-3 rounded-xl font-medium text-sm transition shadow-sm active:scale-95 flex items-center justify-center">
                    Generate
                </button>
            </div>
        </div>

    </main>

    <!-- JavaScript Client Logic -->
    <script>
        async function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('Welcome back, ' + data.username + '!');
                    document.getElementById('user-display').innerText = `Signed in as: ${data.username}`;
                } else {
                    alert(data.error || 'Login failed');
                }
            } catch (err) {
                console.error(err);
                alert('Network error during login');
            }
        }

        async function handleRegister() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('Registration successful! You can now log in.');
                } else {
                    alert(data.error || 'Registration failed');
                }
            } catch (err) {
                console.error(err);
                alert('Network error during registration');
            }
        }

        async function askAI() {
            const prompt = document.getElementById('ai-prompt').value;
            const box = document.getElementById('ai-response-box');

            if (!prompt.trim()) return;

            box.innerHTML = `<span class="text-indigo-600 animate-pulse">Thinking...</span>`;

            try {
                const res = await fetch('/api/ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await res.json();
                if (res.ok) {
                    box.innerText = data.result;
                } else {
                    box.innerText = 'Error: ' + (data.error || 'Failed to generate');
                }
            } catch (err) {
                console.error(err);
                box.innerText = 'Error connecting to AI service.';
            }
        }
    </script>
</body>
</html>
